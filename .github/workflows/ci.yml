# CI: Node-Tests (Browser-Engine, Text-Anonymisierer, Einbettung), Windows PowerShell 5.1 (Pflicht),
# PowerShell 7 und gitleaks. Kein Job darf übersprungen oder als optional markiert werden.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node (web/, core/, Parität mit pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Eingebetteter Kern synchron
        run: node tools/einbetten.js --pruefen
      - name: Netzwerk-Anonymisierer (inkl. Paritätstest mit anon.ps1 über pwsh)
        run: node tests/run-tests.js
      - name: Text-Anonymisierer
        run: node tests/run-tests-text.js
      - name: Browser-Test (echte UI-Handler in headless Chrome, Pflicht)
        env:
          BROWSER_PFLICHT: "1"
        run: node tests/run-tests-browser.js

  windows-ps51:
    name: Windows PowerShell 5.1 (Pflicht)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version und .NET Framework
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Erwartet Windows PowerShell 5.1" }
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
      - name: Prüfbefehl der Admin-VM
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\powershell\anon.ps1 -Pruefen -Eingabe .\tests\erwartet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testsuite
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 *>&1 | Tee-Object -Variable ausgabe
          $code = $LASTEXITCODE
          $zeilen = @($ausgabe | ForEach-Object { "$_" })
          if ($code -ne 0) {
            # Nur bei Fehlschlag: Fehlerzeilen als Annotation (lesbar über die Checks-API, ohne Log-Download)
            $zeilen | Where-Object { $_ -match 'FEHLER|Exception|TESTERGEBNIS' } | Select-Object -First 40 | ForEach-Object { Write-Host ("::error::" + ($_ -replace '[\r\n]', ' ')) }
            exit $code
          }
          # Erfolg: nur die Ergebniszeile als Hinweis
          $zeilen | Where-Object { $_ -match 'TESTERGEBNIS' } | Select-Object -First 1 | ForEach-Object { Write-Host ("::notice::" + ($_ -replace '[\r\n]', ' ')) }

  windows-pwsh7:
    name: PowerShell 7 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Testsuite
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks installieren
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tgz
          tar xzf gitleaks.tgz gitleaks
      # Pflicht: Funde im Arbeitsstand (HEAD) lassen den Job scheitern
      - name: Arbeitsstand prüfen (Pflicht)
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose
      # Nur informativ: Die Historie enthält bekannte erfundene Testschlüssel aus Commit 65cd5d4 (alter Sammler).
      # Keine Allowlist dafür, keine Deaktivierung; Funde erscheinen als Warnung.
      - name: Gesamte Historie prüfen (informativ)
        continue-on-error: true
        run: |
          set +e
          ./gitleaks detect --source . --config .gitleaks.toml --redact --report-format json --report-path historie.json
          code=$?
          if [ "$code" -ne 0 ] && [ -s historie.json ]; then
            jq -r '.[] | "::warning file=\(.File),line=\(.StartLine)::gitleaks (Historie): \(.RuleID) in Commit \(.Commit[0:7]). Bekannte erfundene Testschlüssel aus Commit 65cd5d4 (alter Sammler); verschwinden mit frischem öffentlichem Repo."' historie.json
          fi
          exit $code
